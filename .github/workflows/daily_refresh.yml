name: Daily AI Dashboard Refresh

on:
  schedule:
    # Runs at 11:45 UTC daily (7:45 AM EDT)
    - cron: '0 11 45 * *'
  workflow_dispatch: # Allows manual one-click runs from the GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch feeds and generate daily briefing with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/refresh_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.json index.html
          git diff --staged --quiet || git commit -m "Automated daily AI briefing refresh ($(date -u +'%Y-%m-%d'))"
          git push
